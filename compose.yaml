services:
  postgres:
    build:
      context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wayminder
      WAYMINDER_DB_PASSWORD: ${WAYMINDER_DB_PASSWORD:?set WAYMINDER_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wayminder"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend, model_egress]

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      WAYMINDER_EMBED_MODEL: ${WAYMINDER_EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${WAYMINDER_EMBED_MODEL}\""]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [backend]

  wayminder:
    build: .
    restart: unless-stopped
    environment:
      WAYMINDER_LISTEN_ADDRESS: :8080
      WAYMINDER_DATABASE_URL: postgres://wayminder_app:${WAYMINDER_DB_PASSWORD:?set WAYMINDER_DB_PASSWORD in .env}@postgres:5432/wayminder?sslmode=disable
      WAYMINDER_AUTH_TOKEN: ${WAYMINDER_AUTH_TOKEN:-}
      WAYMINDER_CLIENTS_FILE: ${WAYMINDER_CLIENTS_FILE:-}
      WAYMINDER_ALLOWED_HOSTS: ${WAYMINDER_ALLOWED_HOSTS:-localhost,127.0.0.1,deployment-host,deployment-host.example.com}
      WAYMINDER_OLLAMA_URL: http://ollama:11434
      WAYMINDER_EMBED_MODEL: ${WAYMINDER_EMBED_MODEL:-nomic-embed-text}
      WAYMINDER_EMBED_DIMENSION: ${WAYMINDER_EMBED_DIMENSION:-768}
      WAYMINDER_DEDUP_THRESHOLD: ${WAYMINDER_DEDUP_THRESHOLD:-0.92}
      WAYMINDER_RATE_LIMIT_PER_MINUTE: ${WAYMINDER_RATE_LIMIT_PER_MINUTE:-120}
      WAYMINDER_RATE_LIMIT_BURST: ${WAYMINDER_RATE_LIMIT_BURST:-30}
    ports:
      - "${WAYMINDER_BIND_ADDRESS:-127.0.0.1}:${WAYMINDER_PORT:-8080}:8080"
    volumes:
      - ./secrets/clients.json:/run/secrets/wayminder-clients.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend, frontend]

networks:
  frontend:
  backend:
    internal: true
  model_egress:

volumes:
  postgres_data:
  ollama_data:
